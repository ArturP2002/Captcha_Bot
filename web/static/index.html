<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Капча и промокод</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/static/app/styles.css?v=4">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <img class="app-logo" src="/static/media/Logo.PNG" alt="Логотип">
    </header>

    <section id="captcha-screen" class="screen">
      <h1>Так так так</h1>
      <p class="hint">Пройди капчу - получи промокод. До встречи!</p>

      <div id="captcha-stage" class="captcha-stage">
        <div class="captcha-stage-inner">
          <img id="captcha-bg" class="captcha-bg" src="/static/media/base.png" alt="Капча">
          <img id="hat-piece" class="hat-piece" src="/static/media/hat.png" alt="Кандибобер">
        </div>
      </div>

      <button id="verify-btn" class="btn" type="button">Проверить</button>
      <p id="status" class="status"></p>
    </section>

    <section id="promo-screen" class="screen hidden">
      <h1>Твой промокод</h1>
      <p class="hint">Скопируй и используй</p>
      <div class="promo-card">
        <p class="promo-code" id="promo-code">mongetak</p>
        <button
          id="promo-copy-btn"
          class="promo-copy-btn"
          type="button"
          aria-label="Скопировать промокод"
          title="Скопировать"
        >
          <svg class="promo-copy-icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="9" y="9" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"></rect>
            <path d="M7 15H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v1" fill="none" stroke="currentColor" stroke-width="1.8"></path>
          </svg>
        </button>
      </div>
      <p id="promo-copy-status" class="promo-copy-status" aria-live="polite"></p>
    </section>
  </main>

  <script src="/static/app/app.js?v=7"></script>
</body>
</html>
